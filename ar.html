<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>AR Creator · AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial}.top{position:fixed;z-index:20;top:12px;left:12px;right:12px;background:#fffffff0;padding:12px 14px;display:flex;justify-content:space-between}.top small{display:block;color:#65757b}.top button{background:#14252c;color:white;border:0;padding:9px 12px}.status{position:fixed;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);background:#14252cee;color:white;padding:11px 16px;font-size:.75rem;min-width:300px;text-align:center}.ok{color:#72dc8c}.bad{color:#ffb52d}</style></head><body>
<div class="top"><div><b>AR CREATOR · V4</b><small>Dieselben 3D-Modelle wie im Studio</small></div><button onclick="history.back()">← Studio</button></div><div id="status" class="status">Kamera startet …</div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true;colorManagement:true;logarithmicDepthBuffer:true" arjs="sourceType:webcam;debugUIEnabled:false;">
<a-marker id="hiro" preset="hiro" emitevents="true"><a-entity id="world" scale=".45 .45 .45"></a-entity></a-marker><a-entity light="type:ambient;intensity:.85"></a-entity><a-entity light="type:directional;intensity:.8" position="-3 5 2"></a-entity><a-entity camera></a-entity></a-scene>
<script src="models.js"></script><script>
(()=>{const s=document.getElementById("status"),w=document.getElementById("world");let objs=[];try{objs=JSON.parse(localStorage.getItem("oranienschule-ar-v4")||"[]")}catch(e){};objs.forEach(o=>{let wrap=document.createElement("a-entity");wrap.setAttribute("position",`${o.x} 0 ${o.z}`);wrap.setAttribute("rotation",`0 ${o.r} 0`);wrap.setAttribute("scale",`${o.s} ${o.s} ${o.s}`);wrap.appendChild(ARModels.make(o.type,o.c));w.appendChild(wrap)});s.innerHTML=`SZENE: <b>${objs.length}</b> OBJEKTE · <span class="bad">HIRO SUCHEN …</span>`;let m=document.getElementById("hiro");m.addEventListener("markerFound",()=>s.innerHTML=`SZENE: <b>${objs.length}</b> OBJEKTE · <span class="ok">HIRO ✓</span>`);m.addEventListener("markerLost",()=>s.innerHTML=`SZENE: <b>${objs.length}</b> OBJEKTE · <span class="bad">HIRO SUCHEN …</span>`);})();
</script></body></html>
